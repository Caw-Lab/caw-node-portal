name: archive

# Every six hours (and by hand): reads the archive contract on Arbitrum Sepolia (read-only eth_call, no key, no
# transaction) and publishes archive.json on the `data-archive` branch (an orphan branch that is replaced on every
# run). The portal page reads it from raw.githubusercontent.com and shows one line: how many submissions are
# finalized, inside their challenge window, or past the deadline without being finalized.
# If the chain cannot be read, the job fails and nothing is published, so the last good file stays.
# A scheduled run can start late or be skipped; GitHub may also switch off the schedule of a repository that has
# had no activity for a long time, and then it has to be switched on again in the Actions tab.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'Caw-Lab/caw-node-portal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.4'

      - name: Test the collector
        run: node --test archive/test/*.test.mjs

      - name: Read the archive
        run: node archive/collect.mjs --out archive.json

      - name: Publish archive.json on the data-archive branch
        run: |
          set -euo pipefail
          cp archive.json "$RUNNER_TEMP/archive.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -D data-archive-publish 2>/dev/null || true
          git checkout --orphan data-archive-publish
          git rm -rf --quiet .
          git clean -fdxq
          cp "$RUNNER_TEMP/archive.json" archive.json
          git add archive.json
          git commit -q -m "archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:refs/heads/data-archive
