name: netstats

# Once a day (and by hand): reads each active node's /api/stats and two numbers from the chains, and publishes
# network.json on the `data-network` branch (an orphan branch that is replaced on every run, so the history of
# main does not grow; the history of the numbers is inside the file). The portal page reads it from
# raw.githubusercontent.com. The nodes come from the registry that the seed nodes serve at /api/instances;
# a host name in spotcheck/optout.txt is never contacted.
# A scheduled run can start late or be skipped; GitHub may also switch off the schedule of a repository that has
# had no activity for a long time, and then it has to be switched on again in the Actions tab.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netstats
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'Caw-Lab/caw-node-portal'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.4'

      - name: Fetch the previous file, if there is one
        run: |
          if git ls-remote --exit-code --heads origin data-network >/dev/null 2>&1; then
            git fetch --depth=1 origin data-network
            git show FETCH_HEAD:network.json > previous.json || echo '{}' > previous.json
          else
            echo '{}' > previous.json
          fi

      - name: Collect the numbers
        run: node netstats/collect.mjs --seeds spotcheck/targets.json --optout spotcheck/optout.txt --previous previous.json --out network.json

      - name: Publish network.json on the data-network branch
        run: |
          set -euo pipefail
          cp network.json "$RUNNER_TEMP/network.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -D data-network-publish 2>/dev/null || true
          git checkout --orphan data-network-publish
          git rm -rf --quiet .
          git clean -fdxq
          cp "$RUNNER_TEMP/network.json" network.json
          git add network.json
          git commit -q -m "netstats $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:refs/heads/data-network
