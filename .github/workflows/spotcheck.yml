name: spotcheck

# Checks the nodes in spotcheck/targets.json (and no others) and publishes status.json on the
# `data` branch (an orphan branch that is replaced on every run, so the history
# of main does not grow). The portal page reads it from raw.githubusercontent.com.
# Runs every hour (and by hand). It was paused on 2026-11-13 while the portal moved to Caw-Lab, and started again on 2026-11-14.
# A scheduled run can start late or be skipped; GitHub may also switch off the schedule of a repository
# that has had no activity for a long time, and then it has to be switched on again in the Actions tab.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Host names to check, separated by commas. Empty = every node in spotcheck/targets.json.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: spotcheck
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'Caw-Lab/caw-node-portal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.4'

      - name: Fetch the previous status, if there is one
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:status.json > previous.json || echo '{"nodes":{}}' > previous.json
          else
            echo '{"nodes":{}}' > previous.json
          fi

      - name: Run the spot check
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "${ONLY:-}" ]; then
            node spotcheck/run.mjs --nodes spotcheck/targets.json --optout spotcheck/optout.txt --previous previous.json --only "$ONLY" --out status.json
          else
            node spotcheck/run.mjs --nodes spotcheck/targets.json --optout spotcheck/optout.txt --previous previous.json --out status.json
          fi

      - name: Publish status.json on the data branch
        run: |
          set -euo pipefail
          cp status.json "$RUNNER_TEMP/status.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -D data-publish 2>/dev/null || true
          git checkout --orphan data-publish
          git rm -rf --quiet .
          git clean -fdxq
          cp "$RUNNER_TEMP/status.json" status.json
          git add status.json
          git commit -q -m "spotcheck $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:refs/heads/data
