<style>
:root{--bg:#0f1014;--surface:#171920;--surface2:#1e2129;--line:#2a2e38;--fg:#eceef3;--mute:#9aa1b2;--faint:#6b7283;--accent:#f2b134;--accent-ink:#1a1405;--link:#7cc8ff;--ok:#5fd08a;--warn:#f0c14b;--bad:#ef6f8f;--spark:#7cc8ff;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25)}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--line:#dde1e8;--fg:#161922;--mute:#566074;--faint:#7a8497;--accent:#b97800;--accent-ink:#fff;--link:#0b6aa8;--ok:#1f8f4e;--warn:#9a7300;--bad:#c23a63;--spark:#0b6aa8;--shadow:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
button{font:inherit}
/* header */
.top{padding:28px 0 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand h1{margin:0;font:600 28px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--mute);font-size:15px}
.tools{display:flex;gap:8px;align-items:center}
.pill{font-size:12px;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.beta{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);cursor:help}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:4px 12px;font-size:13px;color:var(--mute);box-sizing:border-box}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible,.ghost:focus-visible,.badge:focus-visible,.fcbtn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
/* summary */
.summary{margin:18px 0 30px}
.sum-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sum-head h2,.list-head h2{margin:0;font-size:19px;font-weight:650}
.asof{color:var(--faint);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;box-shadow:var(--shadow);min-width:0}
.stat[hidden]{display:none}
.stat .label{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cum{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 6px;line-height:1.5}
.stat .value{font-size:30px;line-height:1.15;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0 8px;letter-spacing:-.01em}
.stat .value small{font-size:14px;font-weight:500;color:var(--mute);margin-left:4px}
.stat .hint{min-height:24px;display:flex;align-items:center}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden;width:100%}
.meter i{display:block;height:100%;width:0;border-radius:999px;background:var(--ok);transition:width .5s}
.meter.part i{background:var(--warn)}.meter.none i{background:var(--bad)}
.spark{width:100%;height:24px;display:block}
.spark polyline{fill:none;stroke:var(--spark);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.more-line{display:flex;gap:10px 26px;flex-wrap:wrap;margin:14px 4px 0;color:var(--mute);font-size:14px}
.more-line[hidden],.more-line>span[hidden]{display:none}
.more-line b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
details.about{margin:10px 4px 0;color:var(--mute);font-size:13.5px}
details.about[hidden]{display:none}
details.about summary{cursor:pointer;color:var(--faint);list-style:none}
details.about summary::before{content:"ⓘ "}
details.about p{margin:8px 0 0;max-width:72ch}
/* nodes */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:13.5px}
.ghost{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13px;color:var(--mute)}
.ghost:hover{border-color:var(--accent);color:var(--fg)}
.note{color:var(--mute);font-size:14px;margin:2px 0 8px}
.note.ok{color:var(--faint);font-size:13px;margin:0 0 10px}
.note[hidden]{display:none}
.cols{display:grid;grid-template-columns:18px 1fr 150px 250px;gap:14px;padding:0 16px 6px;color:var(--faint);font-size:12.5px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:18px 1fr 150px 250px;align-items:center;gap:6px 14px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row[hidden]{display:none}
.row.simple{grid-template-columns:1fr}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);justify-self:center;align-self:start;margin-top:8px}
.dot.down{background:var(--bad)}.dot.wait{background:var(--faint)}
.who{min-width:0}
.name{font-weight:650;font-size:16px;overflow-wrap:anywhere;color:var(--fg)}
a.name:hover{color:var(--link)}
.intro{margin:2px 0 0;color:var(--fg);opacity:.86;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.intro.empty{color:var(--faint);font-style:italic;opacity:1}
.meta{margin-top:4px;color:var(--faint);font-size:12.5px;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.meta:empty{display:none}
.tags{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.tags:empty{display:none}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--mute);font-size:12px;white-space:nowrap;cursor:help}
.badge.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.badge.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.badge.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.badge.watch{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.fcbtn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:12px;color:var(--link)}
.fcbtn:hover{border-color:var(--link)}
.tip{font-size:12.5px;color:var(--mute);margin-top:6px;border-left:3px solid var(--accent);padding-left:8px}
.speed{min-width:0}
.speed .ms{font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.speed .ms small{color:var(--faint);font-weight:400;font-size:12px;margin-left:6px}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--faint);border-radius:999px;transition:width .5s,background .5s}
.speed.down .ms{color:var(--bad)}.speed.down .bar{display:none}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap}
.btn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px;color:var(--fg);background:var(--surface2);white-space:nowrap;box-sizing:border-box}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.row.main{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.badge-main{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:700;margin-right:6px}
.fcpanel{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:13px}
.fcline{display:flex;flex-wrap:wrap;gap:2px 10px;margin:2px 0}.fck{color:var(--mute);min-width:9.5em}.fcv{overflow-wrap:anywhere}.fcul{margin:0;padding-left:18px}.fcnote{color:var(--mute);font-size:12px;margin-top:6px}
.fcsec{margin-top:18px}.fcsec[hidden]{display:none}.fcsec h3{margin:0 0 4px;font-size:16px}.sub{color:var(--mute);margin:0 0 8px;font-size:13.5px}
.help{margin:14px 4px 0;display:grid;gap:6px;color:var(--faint);font-size:13px}
.help b{color:var(--mute);font-weight:600}
footer{margin:34px 0 40px;color:var(--faint);font-size:13px;display:flex;gap:6px 16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .summary{margin:12px 0 22px}
  .sum-head{margin-bottom:8px;gap:2px}
  .stat{padding:9px 12px 8px;border-radius:14px}
  .stat .label{font-size:12px;gap:4px}
  .stat .value{font-size:22px;margin:0 0 4px}
  .stat .value small{font-size:12px}
  .stat .hint{min-height:14px}
  .spark{height:14px}
  .meter{height:6px}
  .top{flex-direction:column;gap:10px;padding-top:22px}
  .more-line{display:grid;grid-template-columns:1fr;gap:0;margin:8px 2px 0}
  .more-line>span{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
  .more-line b{white-space:nowrap}
  details.about{margin:6px 2px 0}
  .cols{display:none}
  .row{grid-template-columns:16px 1fr 88px;grid-template-areas:"dot who speed" "acts acts acts";gap:8px 12px;padding:14px}
  .row .dot{grid-area:dot}.row .who{grid-area:who}.row .speed{grid-area:speed}
  .row .acts{grid-area:acts;display:flex;gap:8px;margin-top:0;justify-content:flex-start}
  .row .btn{text-align:center;padding:7px 14px;font-size:13.5px}
  .row.simple{grid-template-columns:1fr;grid-template-areas:none}
  .row.simple .who{grid-area:auto}
  .speed .ms small{display:block;margin:0}
  .help{font-size:12.5px}
}
</style></head><body><div class="wrap">

function showTip(e){

function badge(box,cls,key,text){

  e.onclick=()=>showTip(e);

// Only plain https hostnames are measured or linked: the registry is open to anyone, so an entry can hold any string
// (javascript: links, localhost, IP addresses, ports). Returns the origin, or null.
function safeUrl(u){
  try{
    if(typeof u!=='string'||u.length>200)return null;
    const x=new URL(u);
    if(x.protocol!=='https:'||x.username||x.password||x.port)return null;
    if(x.pathname!=='/'||x.search||x.hash)return null;
    const h=x.hostname.toLowerCase();
    if(!h.includes('.')||h.includes(':')||/^\d+(\.\d+){3}$/.test(h))return null;
    if(h==='localhost'||/\.(local|localhost|internal|lan|home|corp)$/.test(h))return null;
    return x.origin;
  }catch(e){return null}
}
// Only what is not ordinary is shown on a row: a registrant that differs, an inactive registration, an incomplete list, a registration few nodes list.
// "Everything is normal" is said once, above the list (renderRegNote). Whether a node answers is the dot and the speed, not a badge.
function renderBadges(r){
  if(!r.badges)return;
  r.badges.replaceChildren();
  if(r.hand){if(r.compl==='partial')badge(r.badges,'warn','b_partial');else if(r.compl==='empty')badge(r.badges,'warn','b_empty')}
  else if(r.url===null){badge(r.badges,'bad','b_badurl')}
  else{
    if(!r.n.own)badge(r.badges,'','b_other');
    if(!r.n.activeAny)badge(r.badges,'bad','b_inact');
    if(r.compl==='partial')badge(r.badges,'warn','b_partial');else if(r.compl==='empty')badge(r.badges,'warn','b_empty');
    if(r.n.seen!==undefined&&r.n.N>=2){
      if(r.n.seen===0)badge(r.badges,'','b_unseen');
      else if(r.n.seen!==r.n.N)badge(r.badges,r.n.seen*2>=r.n.N?'':'bad','b_seen',lang==='ja'?'掲載 '+r.n.seen+'/'+r.n.N+' ノード':'Listed by '+r.n.seen+' of '+r.n.N+' nodes');
    }
  }
  if(r.url===null)return;
  fcAttach(r);
}

  try{
    const res=await fetch(FC_URL,{cache:'no-store'});
    if(!res.ok)return;
    const parsed=FC.parse(await res.json(),safeUrl);
    if(!parsed||parsed.nodes.size===0)return;
    fc=parsed;rows.forEach(renderRow);renderFcSection();
  }catch(e){/* no status yet: the page works without it */}
}
// ---- network numbers: network.json is written by a scheduled GitHub run (see netstats/) ----
const NET_URL='https://raw.githubusercontent.com/Caw-Lab/caw-node-portal/data-network/network.json';
let net=null;
async function loadNet(){
  try{
    const res=await fetch(NET_URL,{cache:'no-store'});
    if(!res.ok)return;
    const parsed=NET.parse(await res.json());
    if(!parsed)return;
    net=parsed;renderNet();
  }catch(e){/* no file yet: the page works without it */}
}
function spark(tile,key){
  const host=tile.querySelector('.hint');if(!host)return;
  const old=host.querySelector('svg');if(old)old.remove();
  const points=NET.sparkPoints(NET.series(net.history,key),100,20);
  if(!points)return;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','spark');svg.setAttribute('viewBox','0 -2 100 24');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
  const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',points);
  svg.appendChild(line);host.appendChild(svg);
}
function renderNet(){
  const about=document.getElementById('aboutnet');const asof=document.getElementById('asof');
  if(!net){about.hidden=true;asof.textContent='';return}
  const L=net.latest;const more=lang==='ja'?'以上':'+';
  const tiles={users:L.users,posts:L.posts,actions:L.actions};
  for(const key of Object.keys(tiles)){
    const tile=document.getElementById('t_'+key);const n=tiles[key];
    tile.hidden=n===null;
    document.getElementById('v_'+key).textContent=n===null?'':NET.groupDigits(n);
    document.getElementById('u_'+key).textContent=n===null||key==='actions'?'':more;
    if(n!==null)spark(tile,key);else{const old=tile.querySelector('svg');if(old)old.remove()}
  }
  const wk=document.getElementById('t_activeWeek');wk.hidden=L.activeWeek===null;
  document.getElementById('v_activeWeek').textContent=L.activeWeek===null?'':NET.groupDigits(L.activeWeek)+(lang==='ja'?' 以上':'+');
  const dep=NET.formatCaw(L.depositedWei);const dt=document.getElementById('t_depositedWei');dt.hidden=dep===null;
  document.getElementById('v_depositedWei').textContent=dep===null?'':dep;
  about.hidden=false;
  document.getElementById('netinfo').textContent=I[lang].net_note;
  asof.textContent=I[lang].asof.replace('{date}',net.generatedAt);
}
const VERIFY_URL='https://caw-frontend-verify.zinsanjp.workers.dev/'; // the link only fills in the address; the check starts there, when the person presses the button
const rows=[];const byUrl=new Map();const views=new Map();const MAXROWS=40;
function build(n){
  const li=document.createElement('li');li.className='row';
  const dot=document.createElement('span');dot.className='dot wait';li.appendChild(dot);
  const url=safeUrl(n.apiUrl);
  const who=document.createElement('div');who.className='who';
  let nm;
  if(url){nm=document.createElement('a');nm.href=url;nm.target='_blank';nm.rel='noopener noreferrer';nm.textContent=new URL(url).hostname}else{nm=document.createElement('span');nm.textContent=String(n.apiUrl).slice(0,120)}
  nm.className='name';who.appendChild(nm);
  const intro=document.createElement('p');intro.className='intro';who.appendChild(intro);
  const meta=document.createElement('div');meta.className='meta';
  const bx=document.createElement('span');bx.className='tags';const m=document.createElement('span');
  meta.append(bx,m);who.appendChild(meta);li.appendChild(who);
  const sp=document.createElement('div');sp.className='speed';
  const ms=document.createElement('div');ms.className='ms';const t=document.createElement('span');t.textContent='—';const av=document.createElement('small');ms.append(t,av);
  const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('i');bar.appendChild(fill);sp.append(ms,bar);li.appendChild(sp);
  const acts=document.createElement('div');acts.className='acts';
  if(url){
    const host=new URL(url).hostname;
    const c=document.createElement('a');c.className='btn';c.href=VERIFY_URL+'?site='+encodeURIComponent(host);c.target='_blank';c.rel='noopener noreferrer';c.dataset.i18n='check';c.dataset.i18nTitle='check_tip';c.textContent=I[lang].check;c.title=I[lang].check_tip;acts.appendChild(c);
    const o=document.createElement('a');o.className='btn primary';o.href=url;o.target='_blank';o.rel='noopener noreferrer';o.dataset.i18n='open';o.dataset.i18nTitle='open_tip';o.textContent=I[lang].open;o.title=I[lang].open_tip;acts.appendChild(o);
  }
  li.appendChild(acts);
  const row={n,url,t,fill,av,m,badges:bx,intro,dot,speed:sp,card:li,hist:[],state:null};rows.push(row);if(url)byUrl.set(url,row);renderRow(row);return li;
}
for(const n of NODES){document.getElementById(n.group).appendChild(build(n))}
loadFc();loadNet();
const CAP=2000; // バーが満タンになる時間(ms)
function parseView(list){
  const out=[];
  for(const i of list.slice(0,500)){
    if(!i||typeof i.instanceId!=='number'||typeof i.apiUrl!=='string'||typeof i.owner!=='string'||typeof i.validatorAddress!=='string')continue;
    out.push({id:i.instanceId,raw:i.apiUrl,url:safeUrl(i.apiUrl),owner:i.owner.toLowerCase(),val:i.validatorAddress.toLowerCase(),active:i.active===true});
  }
  return out;
}
async function measure(r){
  if(!r.url){r.state='skip';renderRow(r);return}
  const t0=performance.now();
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),4500);
    const res=await fetch(r.url+'/api/instances?_='+Date.now(),{signal:ctl.signal,cache:'no-store'});
    clearTimeout(to);
    if(!res.ok)throw new Error('http '+res.status);
    const d=await res.json();
    if(!d||!Array.isArray(d.instances))throw new Error('not an instance list');
    views.set(r.url,parseView(d.instances));
    const ms=Math.round(performance.now()-t0);
    r.hist.push(ms);if(r.hist.length>10)r.hist.shift();
    r.ms=ms;r.state='ok';
    r.fill.style.width=Math.max(4,Math.min(100,ms/CAP*100))+'%';r.fill.style.background=color(ms);
    const avg=Math.round(r.hist.reduce((a,b)=>a+b,0)/r.hist.length);
    r.avg=avg;renderRow(r);
  }catch(e){
    views.delete(r.url);
    r.state='err';renderRow(r);
    r.fill.style.width='100%';r.fill.style.background='var(--bad)';
  }
}
// Merge what every responding node lists. An entry's "seen" is how many of those nodes list the same registration.
function aggregate(){
  // A node whose list is empty has not synced the registry; it is not counted, so it does not look like a disagreement.
  const lens=[...views.values()].map(v=>v.length).filter(n=>n>0).sort((a,b)=>a-b);
  const ref=lens.length?lens[Math.floor(lens.length/2)]:0;
  const status=new Map();
  for(const [u,v] of views)status.set(u,v.length===0?'empty':(v.length<ref*0.5?'partial':'full'));
  const vs=[...views].filter(([u])=>status.get(u)==='full').map(([,v])=>v);const N=vs.length;const tc=new Map();
  for(const v of vs){
    const once=new Set();
    for(const t of v){
      const k=t.id+'|'+t.raw+'|'+t.owner+'|'+t.val+'|'+t.active;
      if(once.has(k))continue;once.add(k);
      const e=tc.get(k);if(e)e.n++;else tc.set(k,{t,n:1});
    }
  }
  const by=new Map();
  for(const e of tc.values()){const key=e.t.url||('!'+e.t.raw.slice(0,120));if(!by.has(key))by.set(key,[]);by.get(key).push(e)}
  const res=[];
  for(const [key,list] of by){
    const act=list.filter(x=>x.t.active);
    const best=(act.length?act:list).reduce((a,b)=>b.t.id>a.t.id?b:a);
    res.push({url:list[0].t.url,regs:new Set(list.map(x=>x.t.id)).size,latest:best.t.id,own:best.t.owner===best.t.val,activeAny:act.length>0,seen:best.n,N});
  }
  return {res,N,incomplete:views.size-N,status};
}
// Order: responding nodes with a complete list first, then those with "some issues", then those that did not answer.
function rank(r){return r.state==='ok'?((r.compl==='partial'||r.compl==='empty')?1:0):2}
// Filter and sort apply to the registry list only (the mainline row stays at the top). "fast" uses the average of the last measurements in 100 ms steps, so rows do not jump on every refresh.
const view={f:'all',o:'default'};
try{const v=JSON.parse(localStorage.getItem('view')||'{}');if(v.f==='up')view.f='up';if(v.o==='fast'||v.o==='listed')view.o=v.o}catch(e){}
function cmp(a,b){
  const nm=String(a.n.apiUrl).localeCompare(String(b.n.apiUrl));
  if(view.o==='fast'){const k=r=>r.state==='ok'?Math.round((r.avg||r.ms)/100):1e9;return k(a)-k(b)||nm}
  if(view.o==='listed'){const k=r=>r.state==='ok'?-(r.n.seen||0):1;return k(a)-k(b)||rank(a)-rank(b)||nm}
  return rank(a)-rank(b)||nm;
}
function sortCards(){
  const box=document.getElementById('normal');
  const list=rows.filter(r=>!r.hand&&r.card&&r.card.parentNode===box).sort(cmp);
  for(const r of list)r.card.hidden=view.f==='up'&&(r.state==='err'||r.state==='skip');
  const cur=[...box.children].filter(el=>!el.classList.contains('main'));
  if(list.length===cur.length&&list.every((r,i)=>cur[i]===r.card))return;
  for(const r of list)box.appendChild(r.card);
}
function saveView(){try{localStorage.setItem('view',JSON.stringify(view))}catch(e){}}
for(const b of document.querySelectorAll('#filterseg button'))b.onclick=()=>{
  view.f=b.dataset.v;saveView();
  for(const x of document.querySelectorAll('#filterseg button'))x.setAttribute('aria-pressed',String(view.f===x.dataset.v));
  sortCards();
};
document.getElementById('sortsel').onchange=ev=>{const v=ev.target.value;if(v==='default'||v==='fast'||v==='listed'){view.o=v;saveView();sortCards()}};
function renderSummary(){
  const ms=rows.filter(r=>r.url&&r.state);const ok=ms.filter(r=>r.state==='ok');
  const up=document.getElementById('s_up_v');
  up.textContent=ms.length?String(ok.length):'—';
  document.getElementById('s_up_of').textContent=ms.length?(lang==='ja'?'/ '+ms.length+' 台':'/ '+ms.length):'';
  const meter=document.getElementById('s_up_meter');
  meter.firstChild.style.width=ms.length?(ok.length/ms.length*100)+'%':'0%';
  meter.className='meter'+(ms.length&&ok.length!==ms.length?(ok.length?' part':' none'):'');
  meter.setAttribute('aria-label',ms.length?ok.length+'/'+ms.length:'');
  const md=document.getElementById('s_med_v');
  if(ok.length){const a=ok.map(r=>r.ms).sort((x,y)=>x-y);const m=a.length%2?a[(a.length-1)/2]:Math.round((a[a.length/2-1]+a[a.length/2])/2);md.textContent=m+' ms'}
  else{md.textContent='—'}
}
function updateFromViews(){
  if(!views.size)return;
  const ag=aggregate();const agg=ag.res;const present=new Set();let bad=0,hidden=0;
  for(const r of rows){if(r.url&&ag.status.has(r.url))r.compl=ag.status.get(r.url);else r.compl=undefined}
  if(!ag.N){live={N:0,incomplete:ag.incomplete,time:new Date(),bad:0,hidden:0};rows.forEach(renderRow);renderLive();renderRegNote();return}
  for(const a of agg){
    if(!a.url){bad++;continue}
    present.add(a.url);
    const r=byUrl.get(a.url);
    if(r){Object.assign(r.n,{regs:a.regs,latest:a.latest,own:a.own,activeAny:a.activeAny,seen:a.seen,N:a.N});renderRow(r)}
    else if(document.querySelectorAll('#normal .row:not(.main)').length<MAXROWS){
      document.getElementById('normal').appendChild(build({apiUrl:a.url,regs:a.regs,latest:a.latest,own:a.own,activeAny:a.activeAny,seen:a.seen,N:a.N,comment:''}));
    }else hidden++;
  }
  for(const [u,r] of byUrl)if(!present.has(u)){r.n.seen=0;r.n.N=ag.N;renderRow(r)}
  rows.forEach(renderRow);sortCards();renderFcSection();
  live={N:ag.N,incomplete:ag.incomplete,time:new Date(),bad,hidden};renderLive();renderRegNote();
}
let busy=false;
async function all(){
  if(busy)return;busy=true;
  try{await Promise.all(rows.map(measure));updateFromViews()}finally{renderSummary();busy=false}
}
rows.unshift({state:null,url:safeUrl('https://test2.caw.social'),n:{apiUrl:'https://test2.caw.social'},t:document.querySelector('#gil .ms span'),fill:document.querySelector('#gil .bar i'),av:document.querySelector('#gil .ms small'),badges:document.querySelector('#gil .tags'),dot:document.querySelector('#gil .dot'),speed:document.querySelector('#gil .speed'),card:document.getElementById('gil'),hand:true,hist:[]});
document.getElementById('re').onclick=all;
applyLang();
all();
setInterval(()=>{if(!document.hidden)all()},5000);
